name: 🗑️ Mark stale issues and pull requests

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight UTC
  workflow_dispatch:

jobs:
  stale:
    name: 🗑️ Mark stale issues and pull requests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🗑️ Mark stale issues and pull requests
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: |
            This issue has been automatically marked as stale because it has not had recent activity. 
            It will be closed if no further activity occurs within the next 7 days.

            If you believe this issue should remain open, please add a comment or remove the `stale` label.
          stale-pr-message: |
            This pull request has been automatically marked as stale because it has not had recent activity. 
            It will be closed if no further activity occurs within the next 7 days.

            If you believe this PR should remain open, please add a comment or remove the `stale` label.
          close-issue-message: |
            This issue has been automatically closed because it has been marked as stale and has not had recent activity.

            If you believe this issue should be reopened, please create a new issue with the same information.
          close-pr-message: |
            This pull request has been automatically closed because it has been marked as stale and has not had recent activity.

            If you believe this PR should be reopened, please create a new pull request with the same changes.
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
          days-before-stale: 30
          days-before-close: 7
          remove-stale-when-updated: true
          remove-pr-stale-when-updated: true
          exempt-issue-labels: 'pinned,security'
          exempt-pr-labels: 'pinned,security'
          only-issue-labels: ''
          only-pr-labels: ''
          operations-per-run: 100
          debug-only: false
