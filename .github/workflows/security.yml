name: 🔒 Security & Dependencies

on:
  schedule:
    - cron: '0 2 * * 1' # Every Monday at 2 AM
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'

jobs:
  # 🔍 Security Audit
  security-audit:
    name: 🔍 Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📥 Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: 🔍 Run security audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: 🔍 Run security audit (high)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: 📊 Security Audit Summary
        if: always()
        run: |
          echo "## 🔍 Security Audit Results" >> $GITHUB_STEP_SUMMARY
          echo "✅ Security audit completed" >> $GITHUB_STEP_SUMMARY

  # 🔄 Dependencies Update
  dependencies-update:
    name: 🔄 Dependencies Update
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📥 Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: 🔄 Check for outdated packages
        run: npm outdated || true

      - name: 📊 Dependencies Summary
        if: always()
        run: |
          echo "## 🔄 Dependencies Check" >> $GITHUB_STEP_SUMMARY
          echo "✅ Dependencies check completed" >> $GITHUB_STEP_SUMMARY

  # 🛡️ CodeQL Analysis
  codeql:
    name: 🛡️ CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript']

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🛡️ Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: 🔍 Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{matrix.language}}'

      - name: 📊 CodeQL Summary
        if: always()
        run: |
          echo "## 🛡️ CodeQL Analysis Results" >> $GITHUB_STEP_SUMMARY
          echo "✅ CodeQL analysis completed" >> $GITHUB_STEP_SUMMARY

  # 🧹 Dependency Review
  dependency-review:
    name: 🧹 Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🧹 Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate

      - name: 📊 Dependency Review Summary
        if: always()
        run: |
          echo "## 🧹 Dependency Review Results" >> $GITHUB_STEP_SUMMARY
          echo "✅ Dependency review completed" >> $GITHUB_STEP_SUMMARY
