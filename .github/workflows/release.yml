name: 🚀 Release & Versioning

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string

env:
  NODE_VERSION: '20.x'

jobs:
  # 🏷️ Create Release
  create-release:
    name: 🏷️ Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      release_id: ${{ steps.create_release.outputs.id }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📥 Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: 🏗️ Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: 🧪 Run tests
        run: npm run test:all
        env:
          NODE_ENV: test

      - name: 📊 Generate changelog
        id: changelog
        run: |
          # Get the previous tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          CURRENT_TAG=${GITHUB_REF#refs/tags/}

          echo "## 🚀 Release $CURRENT_TAG" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "### 📋 Changes" >> CHANGELOG.md
          echo "" >> CHANGELOG.md

          if [ -n "$PREVIOUS_TAG" ]; then
            git log --pretty=format:"- %s (%h)" $PREVIOUS_TAG..HEAD >> CHANGELOG.md
          else
            git log --pretty=format:"- %s (%h)" --max-count=20 >> CHANGELOG.md
          fi

          echo "" >> CHANGELOG.md
          echo "### 🏗️ Build Information" >> CHANGELOG.md
          echo "- **Node.js**: $(node --version)" >> CHANGELOG.md
          echo "- **NPM**: $(npm --version)" >> CHANGELOG.md
          echo "- **Build Date**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> CHANGELOG.md
          echo "- **Commit**: $GITHUB_SHA" >> CHANGELOG.md

      - name: 🏷️ Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}

      - name: 📊 Release Summary
        if: always()
        run: |
          echo "## 🏷️ Release Created" >> $GITHUB_STEP_SUMMARY
          echo "✅ Release ${{ github.ref_name }} created successfully" >> $GITHUB_STEP_SUMMARY

  # 🐳 Build and Push Docker Image
  docker-release:
    name: 🐳 Docker Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: create-release
    if: github.event_name == 'push'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME || 'test-user' }}
          password: ${{ secrets.DOCKER_PASSWORD || 'test-password' }}

      - name: 🐳 Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME || 'test-user' }}/test-products
          tags: |
            type=ref,event=tag
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 🐳 Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 📊 Docker Release Summary
        if: always()
        run: |
          echo "## 🐳 Docker Release" >> $GITHUB_STEP_SUMMARY
          echo "✅ Docker image built and pushed successfully" >> $GITHUB_STEP_SUMMARY

  # 📦 Build Artifacts
  build-artifacts:
    name: 📦 Build Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: create-release

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📥 Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: 🏗️ Build application
        run: npm run build
        env:
          NODE_ENV: production

      - name: 📦 Create deployment package
        run: |
          mkdir -p dist-package
          cp -r dist dist-package/
          cp package.json dist-package/
          cp package-lock.json dist-package/
          cp README.md dist-package/
          tar -czf test-products-${{ github.ref_name }}.tar.gz -C dist-package .

      - name: 📦 Upload Release Assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./test-products-${{ github.ref_name }}.tar.gz
          asset_name: test-products-${{ github.ref_name }}.tar.gz
          asset_content_type: application/gzip

      - name: 📊 Artifacts Summary
        if: always()
        run: |
          echo "## 📦 Build Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "✅ Release artifacts created and uploaded" >> $GITHUB_STEP_SUMMARY
