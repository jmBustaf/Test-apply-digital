version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'UTC'
    open-pull-requests-limit: 10
    reviewers:
      - 'your-username'
    assignees:
      - 'your-username'
    commit-message:
      prefix: 'chore'
      prefix-development: 'chore'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'javascript'
    groups:
      # Group all patch updates together
      patch-updates:
        patterns:
          - '*'
        update-types:
          - 'patch'
      # Group all minor updates for dev dependencies
      dev-dependencies:
        patterns:
          - '@types/*'
          - '@nestjs/*'
          - 'eslint*'
          - 'prettier*'
          - 'jest*'
          - 'ts-*'
        update-types:
          - 'minor'
          - 'patch'
      # Group all major updates for production dependencies
      production-dependencies:
        patterns:
          - 'pg'
          - 'typeorm'
          - 'bcrypt*'
          - 'contentful'
          - 'joi'
        update-types:
          - 'major'
          - 'minor'
          - 'patch'

  # Enable version updates for GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'UTC'
    open-pull-requests-limit: 5
    reviewers:
      - 'your-username'
    assignees:
      - 'your-username'
    commit-message:
      prefix: 'ci'
      include: 'scope'
    labels:
      - 'github-actions'
      - 'ci'
