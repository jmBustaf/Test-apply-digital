version: '3.8'

services:
  # PostgreSQL Database for Development
  postgres-dev:
    image: postgres:15-alpine
    container_name: test-products-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-test_products_dev}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - app-dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-test_products_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NestJS Application for Development
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: test-products-app-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      
      # Database configuration
      DB_HOST: postgres-dev
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-test_products_dev}
      
      # Contentful configuration
      CONTENTFUL_SPACE_ID: ${CONTENTFUL_SPACE_ID}
      CONTENTFUL_ENVIRONMENT: ${CONTENTFUL_ENVIRONMENT:-master}
      CONTENTFUL_DELIVERY_TOKEN: ${CONTENTFUL_DELIVERY_TOKEN}
      CONTENTFUL_CONTENT_TYPE: ${CONTENTFUL_CONTENT_TYPE}
      
      # JWT configuration
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-key}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      
      # Sync job configuration
      SYNC_JOB_NAME: ${SYNC_JOB_NAME:-contentful-hourly-sync}
      SYNC_INTERVAL_MS: ${SYNC_INTERVAL_MS:-3600000}
      
      # Bcrypt configuration
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-10}
    ports:
      - "3000:3000"
    depends_on:
      postgres-dev:
        condition: service_healthy
    networks:
      - app-dev-network
    volumes:
      - .:/app
      - /app/node_modules
      - /app/dist
    command: npm run start:dev

volumes:
  postgres_dev_data:
    driver: local

networks:
  app-dev-network:
    driver: bridge
